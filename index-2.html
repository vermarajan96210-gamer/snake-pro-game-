<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07152c">
<title>Snake Pro Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 10px;text-align:center;font-family:Arial,sans-serif;color:white;background:linear-gradient(135deg,#07152c,#123c39,#07152c);min-height:100vh}
h1{font-size:32px;color:#4dff9b;text-shadow:0 0 15px #00ff88}
.info{display:flex;justify-content:space-around;margin:15px auto;max-width:400px}
.scorebox{background:#163c38;padding:12px;border-radius:12px;border:1px solid #35e98a}
canvas{width:min(90vw,400px);height:min(90vw,400px);background:#071b20;border:4px solid #39ff91;border-radius:15px;box-shadow:0 0 25px #00ff88;touch-action:manipulation}
button{border:0;border-radius:15px;background:linear-gradient(135deg,#20e879,#00a85a);color:white;font-size:22px;font-weight:bold;padding:14px 22px;margin:6px;box-shadow:0 4px 12px #0008;cursor:pointer}
button:active{transform:scale(.92)}
.controls{margin-top:15px}
.message{color:#ffdb69;font-size:18px;min-height:25px}
small{color:#b7d6d0}
</style>
</head>
<body>
<h1>🐍 SNAKE PRO</h1>
<p>Eat • Grow • Win!</p>
<div class="info">
 <div class="scorebox">Score: <span id="score">0</span></div>
 <div class="scorebox">Best: <span id="best">0</span></div>
</div>
<canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
<p class="message" id="msg">START दबाकर खेलें!</p>
<button onclick="start()">▶ START</button>
<button onclick="pause()">⏸ PAUSE</button>
<button onclick="reset()">🔄 RESET</button>
<div class="controls">
 <div><button onclick="turn(0,-1)">⬆️</button></div>
 <button onclick="turn(-1,0)">⬅️</button>
 <button onclick="turn(0,1)">⬇️</button>
 <button onclick="turn(1,0)">➡️</button>
</div>
<p><small>कंप्यूटर पर Arrow Keys से भी खेल सकते हैं।</small></p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const cells=20,size=20;
let snake,food,dx,dy,score,timer=null,running=false;
let best=0;
try{best=Number(localStorage.getItem("snakeProBest"))||0}catch(e){}
document.getElementById("best").innerText=best;
function reset(){
 clearInterval(timer);timer=null;running=false;
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dx=1;dy=0;
 score=0;food={x:15,y:10};
 document.getElementById("score").innerText=0;
 document.getElementById("msg").innerText="START दबाकर खेलें!";
 draw();
}
function newFood(){
 do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}
 while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function start(){
 if(running)return;
 running=true;document.getElementById("msg").innerText="खेल जारी है!";
 timer=setInterval(move,130);
}
function pause(){
 if(!running)return;
 clearInterval(timer);timer=null;running=false;
 document.getElementById("msg").innerText="गेम रोक दिया गया है।";
}
function turn(x,y){
 if(x===-dx&&y===-dy)return;
 if((x===0&&dx!==0)||(y===0&&dy!==0)){dx=x;dy=y}
}
function move(){
 const head={x:snake[0].x+dx,y:snake[0].y+dy};
 const eating=head.x===food.x&&head.y===food.y;
 const body=eating?snake:snake.slice(0,-1);
 if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||body.some(p=>p.x===head.x&&p.y===head.y)){
  clearInterval(timer);timer=null;running=false;
  document.getElementById("msg").innerText="GAME OVER! आपका स्कोर: "+score;
  return;
 }
 snake.unshift(head);
 if(eating){
  score++;document.getElementById("score").innerText=score;
  if(score>best){
   best=score;document.getElementById("best").innerText=best;
   try{localStorage.setItem("snakeProBest",String(best))}catch(e){}
  }
  newFood();
 }else snake.pop();
 draw();
}
function draw(){
 ctx.clearRect(0,0,400,400);
 ctx.strokeStyle="#173b3b";
 for(let i=0;i<=400;i+=20){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke();
 }
 ctx.shadowColor="#ff1744";ctx.shadowBlur=15;ctx.fillStyle="#ff344d";
 ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);ctx.fill();
 snake.forEach((p,i)=>{
  ctx.shadowColor="#00ff80";ctx.shadowBlur=10;
  ctx.fillStyle=i===0?"#a2ffbb":"#22d66d";
  ctx.beginPath();ctx.roundRect(p.x*20+1,p.y*20+1,18,18,6);ctx.fill();
 });
 ctx.shadowBlur=0;
}
document.addEventListener("keydown",e=>{
 const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
 if(keys[e.key]){e.preventDefault();turn(...keys[e.key])}
});
reset();
</script>
</body>
</html>
